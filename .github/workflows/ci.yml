name: ci

# Las acciones van en su mayor actual y PINEADAS POR SHA COMPLETO: un tag de
# action es movil y quien controle ese repositorio puede reapuntarlo para
# ejecutar codigo nuevo aqui sin cambiar una linea de este archivo. Los SHA
# se resolvieron el 2026-08-14 con `git ls-remote --tags` contra los
# repositorios oficiales. Es INDEPENDIENTE del Node 20 que se instala mas
# abajo para el validador PBIR de Microsoft.
#
# Los TAGS ya no disparan este workflow: de v* se encarga release.yml de
# principio a fin. Antes corrian los dos, y publish-pypi publicaba sin
# esperar a que este terminara.
#
# Windows y solo Windows: Power BI Desktop es Windows-only, la capa en vivo usa
# .NET Framework via pythonnet, y buena parte de la suite comprueba semantica de
# rutas de Windows (UNC, \\?\, nombres reservados, ADS). En Linux no probaria lo
# que hay que probar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo lectura: este workflow no publica, no etiqueta y no comenta.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # La minima que declara pyproject y una moderna. Si la suite pasa en
        # ambas, el rango `requires-python` es cierto y no una intencion.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      # Node >= 20 para el validador PBIR oficial de Microsoft. Sin el, la
      # suite pasa igual: las pruebas usan un CLI falso determinista y la de
      # integracion real se omite sola.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Instalar el paquete y las dependencias de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      # INSTALL-009. Determinista y OFFLINE: no le pregunta a PyPI si hay
      # versiones nuevas -para eso esta `--updates`, que es informativo-, sino
      # si los locks que probamos siguen siendo coherentes: formato, hashes,
      # duplicados, cabecera y toda dependencia declarada fijada. La instalación
      # real de cada lock vive en el job ligero `lock-reproducibility`.
      #
      # DESPUES de instalar y no antes: en 3.10 hace falta `tomli` para leer
      # pyproject, y viene en el extra de test.
      - name: Integridad de los locks de dependencias
        run: python scripts/generar_lock.py --check

      - name: Calidad estatica
        run: |
          python -m ruff check src scripts tests
          python -m mypy

      # Esquemas oficiales del PBIR. Se descargan con hash verificado; sin
      # ellos, las pruebas que escriben PBIR fallarian con schema_unavailable.
      - name: Esquemas PBIR (verificados por SHA-256)
        run: python scripts/fetch_pbir_schemas.py

      - name: Validador PBIR oficial de Microsoft
        run: python scripts/fetch_report_validator.py

      # Las DLL de Analysis Services. La SUITE pasa sin ellas, pero `doctor`
      # las considera un requisito obligatorio —y tiene razon: sin ellas la
      # capa en vivo no puede funcionar—, asi que sin este paso el propio
      # diagnostico fallaria en CI. Version fijada y hash verificado.
      - name: DLLs de Analysis Services (verificadas por SHA-256)
        run: python scripts/fetch_libs.py

      # Cobertura una sola vez: la suite funcional ya corre en ambos extremos
      # del rango; instrumentarla dos veces solo duplica minutos de CI.
      - name: Pruebas
        shell: pwsh
        run: |
          if ("${{ matrix.python-version }}" -eq "3.13") {
            python -m pytest -q --cov=horizun_pbi_mcp --cov-report=term
          } else {
            python -m pytest -q
          }

      - name: Diagnostico de la instalacion
        run: python scripts/doctor.py

      - name: Contrato MCP congelado
        run: python -m tests.contract_utils

  # G4.6: cada lock se prueba con SU intérprete real. Este job es deliberadamente
  # pequeño: crear dos venv, instalar con --require-hashes y comparar versiones
  # no exige descargar esquemas, DLLs ni repetir cinco veces toda la suite.
  lock-reproducibility:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar el ejecutor de la prueba
        run: python -m pip install "pytest>=8" tomli
      - name: Verificar e instalar dos veces el lock de este intérprete
        run: |
          python scripts/generar_lock.py --check
          python -m pytest -q tests/test_lock_de_dependencias.py::test_dos_instalaciones_reales_dan_exactamente_las_mismas_versiones

  build:
    runs-on: windows-latest
    needs: [test, lock-reproducibility]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Construir wheel y sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Comprobar los artefactos
        # No se publica en ningun indice: solo se verifica que se construyen y
        # que los metadatos son validos.
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14

# Lo que este workflow NO hace, a proposito:
#   - no usa secretos: nada aqui necesita credenciales;
#   - no descarga modelos ni informes reales;
#   - no ejecuta pruebas `live` ni `live_validator`: exigen Power BI Desktop
#     abierto y se omiten solas;
#   - no publica en PyPI ni en el MCP Registry: de eso se encarga
#     release.yml, y solo despues de que la suite pase sobre el artefacto
#     ya construido.
